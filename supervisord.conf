[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0


[program:django]
command=sh ./resources/scripts/entrypoint-server.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/django.log
stderr_logfile=/var/log/django.err.log


[program:celery-worker]
command=sh ./resources/scripts/celery-worker.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/celery-worker.log
stderr_logfile=/var/log/celery-worker.err.log


[program:celery-beat]
command=sh ./resources/scripts/celery-beat.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/celery-beat.log
stderr_logfile=/var/log/celery-beat.err.log


[program:sync-docker]
command=sh ./resources/scripts/sync-docker.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/sync-docker.log
stderr_logfile=/var/log/sync-docker.err.log

