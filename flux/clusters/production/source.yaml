# This file defines the GitRepository source for Flux
# It tells Flux where to find the Kubernetes manifests
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: botmother
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/BotMather/backend
  ref:
    branch: main
  # If using private repository, uncomment and configure:
  # secretRef:
  #   name: github-credentials
