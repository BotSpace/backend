# This Kustomization tells Flux to apply the botmother application
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: botmother
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: botmother
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: web
      namespace: botmother
    - apiVersion: apps/v1
      kind: Deployment
      name: nginx
      namespace: botmother
  timeout: 5m
