apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother

resources:
  - namespace.yaml
  - redis-daemonset.yaml
  - api-configmap.yaml
  - api-secrets.yaml
  - pvcs.yaml
  - api-deployment.yaml
  - api-service.yaml

# You can customize this for different environments
# For example, create overlays for dev/staging/prod

commonLabels:
  project: botmother
  managed-by: kustomize
