apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother

resources:
  - namespace.yaml
  - configmap.yaml
  - rbac.yaml
  - postgres.yaml
  - redis.yaml
  - web.yaml
  - nginx.yaml
  - ingress.yaml

# Image configuration - update tag via CI/CD
images:
  - name: registry.jscorp.uz/botmother
    newTag: latest

# Common labels
commonLabels:
  app.kubernetes.io/name: botmother
  app.kubernetes.io/managed-by: kustomize
