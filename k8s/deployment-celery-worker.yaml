apiVersion: apps/v1
kind: Deployment
metadata:
  name: botmother-celery-worker
  namespace: botmother
  labels:
    app: botmother
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: botmother
      component: celery-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: botmother
        component: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: registry.jscorp.uz/botmother:latest
        imagePullPolicy: Always
        command: ["sh", "./resources/scripts/celery-worker.sh"]
        env:
        - name: PYTHONPYCACHEPREFIX
          value: "/var/cache/pycache"
        envFrom:
        - configMapRef:
            name: botmother-config
        - secretRef:
            name: botmother-secret
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: pycache
          mountPath: /var/cache/pycache
        - name: tmp
          mountPath: /tmp
        - name: engine
          mountPath: /mnt/engine
      volumes:
      - name: pycache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: engine
        # SECURITY NOTE: hostPath is used to access Docker engine on the host
        # This is required for container management functionality
        # Ensure this deployment runs on trusted nodes only
        hostPath:
          path: /mnt/engine
          type: DirectoryOrCreate
