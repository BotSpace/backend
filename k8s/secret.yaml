apiVersion: v1
kind: Secret
metadata:
  name: botmother-secret
  namespace: botmother
type: Opaque
stringData:
  # Django configs
  # IMPORTANT: Change these values in production!
  DJANGO_SECRET_KEY: "change-me-in-production"

  # Database credentials (for external PostgreSQL)
  DB_HOST: "postgres.example.com"
  DB_PASSWORD: "change-me-in-production"

  # Redis credentials (for external Redis)
  REDIS_HOST: "redis.example.com"
  REDIS_URL: "redis://redis.example.com:6379"

  # MongoDB
  MONGO_URL: "mongodb://user:pass@mongo.example.com:27017"

  # SMS service
  SMS_API_URL: "https://notify.eskiz.uz/api"
  SMS_LOGIN: "admin@gmail.com"
  SMS_PASSWORD: "change-me"

  # Storage
  STORAGE_ID: "change-me"
  STORAGE_KEY: "change-me"
  STORAGE_URL: "example.com"
  STORAGE_BUCKET_MEDIA: "media"
  STORAGE_BUCKET_STATIC: "static"
  STORAGE_PATH: "api.botmother.uz/bucket/"
  STORAGE_PROTOCOL: "https:"

  # API and Bot
  API_URL: "https://api.botmother.uz"
  BOT_TOKEN: "change-me"
  TEST_BOT_TOKEN: "change-me"

  # Payment gateways
  CLICK_SERVICE_ID: "change-me"
  CLICK_MERCHANT_ID: "change-me"
  CLICK_SECRET_KEY: "change-me"
  PAYTECH_API_KEY: "change-me"
  PAYME_ID: "change-me"
  PAYME_KEY: "change-me"

  # Docker Registry
  DOCKER_USERNAME: "change-me"
  DOCKER_PASSWORD: "change-me"
  DOCKER_REGISTRY: "registry.jscorp.uz"

  # Allowed hosts and CSRF
  ALLOWED_HOSTS: "api.botmother.uz"
  CSRF_TRUSTED_ORIGINS: "https://api.botmother.uz"
