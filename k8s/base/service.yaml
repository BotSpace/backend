apiVersion: v1
kind: Service
metadata:
  name: botmother-web
  namespace: botmother
  labels:
    app: botmother
    component: web
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: botmother
    component: web
---
apiVersion: v1
kind: Service
metadata:
  name: botmother-nginx
  namespace: botmother
  labels:
    app: botmother
    component: nginx
spec:
  type: LoadBalancer  # Change to NodePort or use Ingress if preferred
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
    # nodePort: 30080  # Uncomment if using NodePort
  selector:
    app: botmother
    component: nginx
