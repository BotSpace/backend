apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: botmother-media
  namespace: botmother
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # Change to your StorageClass
---
