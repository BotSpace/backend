apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: botmother-media
  namespace: botmother
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  # IMPORTANT: Update storageClassName to match your cluster
  # Check available: kubectl get storageclass
  # Common values: standard, gp2 (AWS), pd-standard (GKE), managed-csi (Azure)
  storageClassName: standard
---
