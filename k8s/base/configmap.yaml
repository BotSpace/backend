apiVersion: v1
kind: ConfigMap
metadata:
  name: botmother-config
  namespace: botmother
data:
  # Django configs
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DEBUG: "False"
  PROJECT_ENV: "prod"
  PROTOCOL_HTTPS: "True"
  
  # OTP configs
  OTP_SIZE: "4"
  OTP_PROD: "false"
  OTP_DEFAULT: "1111"
  
  # Database configs - External PostgreSQL
  DB_ENGINE: "django.db.backends.postgresql_psycopg2"
  DB_NAME: "django"
  DB_USER: "postgres"
  DB_PORT: "5432"
  # DB_HOST will be set in production overlay
  
  # Cache - External Redis
  CACHE_BACKEND: "django.core.cache.backends.redis.RedisCache"
  REDIS_PORT: "6379"
  # REDIS_HOST and REDIS_URL will be set in production overlay
  
  CACHE_ENABLED: "True"
  CACHE_TIMEOUT: "120"
  
  # Vite settings
  VITE_LIVE: "False"
  VITE_PORT: "5173"
  VITE_HOST: "127.0.0.1"
  
  # Addition
  ALLOWED_HOSTS: "web,botmother-web"
  
  OTP_MODULE: "core.services.otp"
  OTP_SERVICE: "EskizService"
  
  # Storage
  STORAGE_DEFAULT: "FILE"
  STORAGE_STATIC: "STATIC"
  STORAGE_PATH: "127.0.0.1:8081/bucket/"
  STORAGE_PROTOCOL: "http:"
  
  # Pricing
  RAM_PRICE: "1000"
  CPU_PRICE: "1000"
  NET_RX_PRICE: "1000"
  NET_TX_PRICE: "1000"
  STORAGE_PRICE: "1000"
  
  # Kubernetes config
  K8S_NAMESPACE: "botmother"
  
  # Python cache
  PYTHONPYCACHEPREFIX: "/var/cache/pycache"
