apiVersion: v1
kind: Secret
metadata:
  name: botmother-secret
  namespace: botmother
type: Opaque
stringData:
  # CRITICAL: DO NOT deploy with these placeholder values!
  # These are INVALID placeholders - replace ALL values before deployment
  # Create secrets using: kubectl create secret generic botmother-secret ...
  
  DJANGO_SECRET_KEY: "REPLACE_ME_OR_DEPLOYMENT_WILL_FAIL_minimum_50_characters_long_random_string"
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_DB_PASSWORD"
  
  # SMS service
  SMS_API_URL: "https://notify.eskiz.uz/api"
  SMS_LOGIN: "REPLACE_WITH_SMS_LOGIN"
  SMS_PASSWORD: "REPLACE_WITH_SMS_PASSWORD"
  
  # Storage
  STORAGE_ID: "REPLACE_WITH_STORAGE_ID"
  STORAGE_KEY: "REPLACE_WITH_STORAGE_KEY"
  STORAGE_URL: "REPLACE_WITH_STORAGE_URL"
  STORAGE_BUCKET_MEDIA: "REPLACE_WITH_BUCKET_NAME"
  STORAGE_BUCKET_STATIC: "REPLACE_WITH_BUCKET_NAME"
  
  # API
  API_URL: "https://REPLACE_WITH_YOUR_DOMAIN.com"
  BOT_TOKEN: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
  TEST_BOT_TOKEN: "REPLACE_WITH_TEST_BOT_TOKEN"
  
  # CLICK
  CLICK_SERVICE_ID: "none"
  CLICK_MERCHANT_ID: "none"
  CLICK_SECRET_KEY: "none"
  
  # PAYME
  PAYTECH_API_KEY: "REPLACE_WITH_PAYTECH_KEY"
  PAYME_ID: "none"
  PAYME_KEY: "none"
  
  # Docker Registry
  DOCKER_USERNAME: "REPLACE_WITH_DOCKER_USERNAME"
  DOCKER_PASSWORD: "REPLACE_WITH_DOCKER_PASSWORD"
  DOCKER_REGISTRY: "registry.jscorp.uz"
  
  # MongoDB (if needed)
  MONGO_URL: "mongodb://user:REPLACE_WITH_PASSWORD@mongo-host:27017"
  
  # RSA Keys (base64 encoded or plain text)
  PRIVATE_KEY: ""
  PUBLIC_KEY: ""
