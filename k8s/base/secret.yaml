apiVersion: v1
kind: Secret
metadata:
  name: botmother-secret
  namespace: botmother
type: Opaque
stringData:
  # IMPORTANT: Replace these values in production!
  # Use: kubectl create secret generic botmother-secret --from-literal=DJANGO_SECRET_KEY=your-key ...
  
  DJANGO_SECRET_KEY: "change-this-in-production-to-a-long-random-string"
  DB_PASSWORD: "change-this-db-password"
  
  # SMS service
  SMS_API_URL: "https://notify.eskiz.uz/api"
  SMS_LOGIN: "admin@gmail.com"
  SMS_PASSWORD: "change-this-key"
  
  # Storage
  STORAGE_ID: "change-this-id"
  STORAGE_KEY: "change-this-key"
  STORAGE_URL: "example.com"
  STORAGE_BUCKET_MEDIA: "change-this-name"
  STORAGE_BUCKET_STATIC: "change-this-name"
  
  # API
  API_URL: "http://localhost:8081"
  BOT_TOKEN: "change-this-token"
  TEST_BOT_TOKEN: "change-this-token"
  
  # CLICK
  CLICK_SERVICE_ID: "none"
  CLICK_MERCHANT_ID: "none"
  CLICK_SECRET_KEY: "none"
  
  # PAYME
  PAYTECH_API_KEY: "6bb7d17e-c22b-44ee-96f3-d93f8b0d750b"
  PAYME_ID: "none"
  PAYME_KEY: "none"
  
  # Docker Registry
  DOCKER_USERNAME: "user"
  DOCKER_PASSWORD: "password"
  DOCKER_REGISTRY: "registry.jscorp.uz"
  
  # MongoDB (if needed)
  MONGO_URL: "mongodb://bot:password@mongo-host:27017"
  
  # RSA Keys (base64 encoded or plain text)
  PRIVATE_KEY: ""
  PUBLIC_KEY: ""
