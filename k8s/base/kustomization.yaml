apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment-web.yaml
  - deployment-nginx.yaml
  - service.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: botmother
  app.kubernetes.io/managed-by: kustomize

# Common annotations
commonAnnotations:
  description: "BotMother Backend Application"
