apiVersion: v1
kind: ConfigMap
metadata:
  name: botmother-config
  namespace: botmother
data:
  # External PostgreSQL connection
  # IMPORTANT: Replace with your actual external PostgreSQL host
  # Example IP: DB_HOST: "10.0.1.100"
  # Example domain: DB_HOST: "postgres.mycompany.com"
  DB_HOST: "REPLACE_WITH_POSTGRES_HOST_IP_OR_DOMAIN"  # Change to your PostgreSQL server IP/hostname
  
  # External Redis connection
  # IMPORTANT: Replace with your actual external Redis host
  # Example IP: REDIS_HOST: "10.0.1.101"
  # Example domain: REDIS_HOST: "redis.mycompany.com"
  REDIS_HOST: "REPLACE_WITH_REDIS_HOST_IP_OR_DOMAIN"  # Change to your Redis server IP/hostname
  REDIS_URL: "redis://REPLACE_WITH_REDIS_HOST_IP_OR_DOMAIN:6379"  # Change to your Redis server
  
  # Production-specific settings
  ALLOWED_HOSTS: "web,botmother-web,your-domain.com"  # Add your domain
  CSRF_TRUSTED_ORIGINS: "https://your-domain.com"  # Add your domain
  
  # Port for production
  PORT: "80"
