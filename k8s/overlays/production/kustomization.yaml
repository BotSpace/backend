apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother

resources:
  - ../../base

# Production-specific patches
patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml

# Images - Update with your actual image tags
images:
  - name: registry.jscorp.uz/botmother
    newTag: latest  # Or specific version tag

# Production replicas
replicas:
  - name: botmother-web
    count: 2  # Scale to 2 replicas for HA
  - name: botmother-nginx
    count: 2  # Scale to 2 replicas for HA
