apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botmother

bases:
  - ../../base

# Production-specific patches
patchesStrategicMerge:
  - configmap-patch.yaml
  - deployment-patch.yaml

# Images - Update with your actual image tags
images:
  - name: registry.jscorp.uz/botmother
    newTag: latest  # Or specific version tag

# ConfigMap generator for production-specific env vars
# configMapGenerator:
#   - name: botmother-config
#     behavior: merge
#     literals:
#       - DB_HOST=your-postgres-host
#       - REDIS_HOST=your-redis-host

# Production replicas
replicas:
  - name: botmother-web
    count: 2  # Scale to 2 replicas for HA
  - name: botmother-nginx
    count: 2  # Scale to 2 replicas for HA
