name: Build and Push Docker Image

on:
  push:
    tags:
      - "*-dev"
      - "*-prod"

env:
  PROJECT_NAME: botmother
  K8S_NAMESPACE: botmother

permissions:
  contents: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy env
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔨 Build image locally
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          load: true
          push: false
          tags: ${{ env.PROJECT_NAME }}:test
          no-cache: true

      # 🧪 Run tests
      - name: Run migrations and tests
        run: |
          docker run --rm \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=testdb \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e REDIS_URL=redis://localhost:6379 \
            -e REDIS_HOST=localhost \
            -e MONGO_URL=mongodb://localhost:27017 \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            ${{ env.PROJECT_NAME }}:test \
            sh -c "python manage.py migrate && pytest -v"

      # 🔐 Login Docker registry
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag & push image (git tag)
        run: |
          docker tag ${{ env.PROJECT_NAME }}:test \
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ github.ref_name }}
          docker tag ${{ env.PROJECT_NAME }}:test \
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:latest

          docker push ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ github.ref_name }}
          docker push ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:latest

          echo "PUSHED TAG IMAGE: ${{ github.ref_name }}"

  rollout:
    needs: build-test-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ endsWith(github.ref_name, '-prod') && 'production' || 'staging' }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == *-prod ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
            echo "namespace=${{ env.K8S_NAMESPACE }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
            echo "namespace=${{ env.K8S_NAMESPACE }}-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Roll out new image
        run: |
          IMAGE=${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ github.ref_name }}
          kubectl -n ${{ steps.env.outputs.namespace }} set image deployment/${{ env.PROJECT_NAME }}-web web="$IMAGE"
          kubectl -n ${{ steps.env.outputs.namespace }} rollout status deployment/${{ env.PROJECT_NAME }}-web --timeout=5m

      - name: Smoke-check readiness probe
        run: |
          NS=${{ steps.env.outputs.namespace }}
          POD=$(kubectl -n "$NS" get pod -l app=${{ env.PROJECT_NAME }}-web -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" exec "$POD" -- curl -fsS http://localhost:8000/readyz/

      - name: Notify on failure
        if: failure()
        run: echo "::error::Rollout failed for tag ${{ github.ref_name }}"
