name: Build, Test, Push & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - '*.md'

env:
  PROJECT_NAME: botmother
  REGISTRY_PROJECT: botspace
  K8S_NAMESPACE: botmother

permissions:
  contents: write

jobs:
  build-test-push:
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Copy env
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          load: true
          push: false
          tags: ${{ env.PROJECT_NAME }}:test
          no-cache: true

      - name: Verify image starts
        run: |
          docker run --rm \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=testdb \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e REDIS_URL=redis://localhost:6379 \
            -e REDIS_HOST=localhost \
            -e MONGO_URL=mongodb://localhost:27017 \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            ${{ env.PROJECT_NAME }}:test \
            python -c "import django; django.setup(); print('OK')" || true

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag & push image
        run: |
          IMAGE_BASE=${{ vars.DOCKER_REGISTRY }}/${{ env.REGISTRY_PROJECT }}/${{ env.PROJECT_NAME }}
          docker tag ${{ env.PROJECT_NAME }}:test "$IMAGE_BASE:${{ env.SHORT_SHA }}"
          docker tag ${{ env.PROJECT_NAME }}:test "$IMAGE_BASE:latest"

          push_image() {
            local image="$1"
            for attempt in 1 2 3; do
              if docker push "$image"; then
                return 0
              fi
              echo "Push failed for $image (attempt $attempt), retrying..."
              sleep $((attempt * 20))
            done
            docker push "$image"
          }

          push_image "$IMAGE_BASE:${{ env.SHORT_SHA }}"
          push_image "$IMAGE_BASE:latest"

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ env.SHORT_SHA }}\"|" helm/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --cached --quiet || git commit -m "deploy: update image tag to ${{ env.SHORT_SHA }}"
          git push origin main
