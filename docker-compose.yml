networks:
  django:
    driver: bridge
  botmother:
    driver: overlay
    external: true

volumes:
  pg_data: null
  pycache: null

services:
  nginx:
    networks:
      - django
    ports:
      - ${PORT:-8001}:80
    volumes:
      - ./resources/layout/nginx.conf:/etc/nginx/nginx.conf
      - ./resources/:/usr/share/nginx/html/resources/
    build:
      context: .
      dockerfile: ./docker/Dockerfile.nginx
    depends_on:
      - web
  web:
    networks:
      - django
      - botmother
    build:
      context: .
      dockerfile: ./docker/Dockerfile.web
    restart: always
    command: "sh ./resources/scripts/entrypoint.sh"
    env_file:
      - .env
    environment:
      - PYTHONPYCACHEPREFIX=/var/cache/pycache
      - SCRIPT=${SCRIPT:-entrypoint.sh}
    volumes:
      - .:/code
      - pycache:/var/cache/pycache
      - /var/lib/engine:/var/lib/engine
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
      - redis
  db:
    networks:
      - django
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-django}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2309}
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    networks:
      - django
    restart: always
    image: redis
