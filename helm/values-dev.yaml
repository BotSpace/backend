# Dev environment overrides — merged on top of values.yaml
image:
  tag: "2.4.9-dev"

service:
  nodePort: 31002

configMaps:
  config:
    DEBUG: "True"
    DJANGO_SETTINGS_MODULE: "config.settings.production"
    PROJECT_ENV: "dev"
    PROTOCOL_HTTPS: "False"
    SILK_ENABLED: "False"
    OTP_SIZE: "4"
    OTP_PROD: "false"
    OTP_MODULE: "core.services.otp"
    OTP_SERVICE: "EskizService"
    DB_ENGINE: "django.db.backends.postgresql_psycopg2"
    CACHE_BACKEND: "django.core.cache.backends.redis.RedisCache"
    REDIS_PORT: "6379"
    CACHE_ENABLED: "true"
    CACHE_TIMEOUT: "120"
    VITE_LIVE: "false"
    VITE_PORT: "5173"
    VITE_HOST: "127.0.0.1"
    STORAGE_DEFAULT: "FILE"
    STORAGE_STATIC: "STATIC"
    RAM_PRICE: "1000"
    CPU_PRICE: "1000"
    NET_RX_PRICE: "1000"
    NET_TX_PRICE: "1000"
    STORAGE_PRICE: "1000"
    PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_metrics"
  k8s:
    K8S_NAMESPACE: "botmother-dev"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

podDisruptionBudget:
  enabled: false
